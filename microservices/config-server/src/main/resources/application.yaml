spring:
    application:
        name: config-server
    cloud:
        config:
            server:
                git: 
                    uri: https://github.com/ismlfrkn/Toyota-Finans-Portal-Sistemi.git
                    default-label: main
                    search-paths: microservices/configs,microservices/configs/{application}
                    clone-on-start: true
                    force-pull: true
server:
    port: 8888

eureka:
    client:
        fetch-registry: false
        register-with-eureka: true
        service-url:
            defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
