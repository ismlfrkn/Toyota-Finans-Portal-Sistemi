spring:
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: market-data-service
                          uri: lb://market-data-service
                          predicates:
                              - Path=/api/v1/instruments/**

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

server:
    port: 8080
