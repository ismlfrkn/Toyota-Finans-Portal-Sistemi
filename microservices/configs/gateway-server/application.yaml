spring:
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: market-data-service
                          uri: lb://market-data-service
                          predicates:
                              - Path=/api/v1/instruments/**
                        - id: user-service
                          uri: lb://user-service
                          predicates:
                              - Path=/api/v1/users/**

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/finans-portal}

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

server:
    port: 8080
