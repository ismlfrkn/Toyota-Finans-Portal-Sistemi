server:
    port: 9001

spring:
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:toyota_finans}?currentSchema=user_service
        username: ${POSTGRES_USER:toyota}
        password: ${POSTGRES_PASSWORD:toyota}
    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                default_schema: user_service
    flyway:
        enabled: true
        schemas: user_service
        default-schema: user_service
        create-schemas: true
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/finans-portal}

eureka:
    client:
        register-with-eureka: true
        fetch-registry: false
        service-url:
            defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
