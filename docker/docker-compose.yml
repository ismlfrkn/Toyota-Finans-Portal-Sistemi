name: toyota-finans-portal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: ../microservices
      dockerfile: config-server/Dockerfile
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy

  discovery-server:
    build:
      context: ../microservices
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy

  gateway-server:
    build:
      context: ../microservices
      dockerfile: gateway-server/Dockerfile
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/finans-portal
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  market-data-service:
    build:
      context: ../microservices
      dockerfile: market-data-service/Dockerfile
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/finans-portal
    ports:
      - "9002:9002"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  user-service:
    build:
      context: ../microservices
      dockerfile: user-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/finans-portal
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  bff-server:
    build:
      context: ../microservices
      dockerfile: bff-server/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URI: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/finans-portal
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET}
    ports:
      - "9000:9000"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      gateway-server:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
